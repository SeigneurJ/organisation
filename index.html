<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="Un espace simple pour organiser votre journée, vos tâches et vos habitudes.">
  <title>Organisation</title>
  <style>
:root {
      --paper: #f5f2e9;
      --paper-deep: #ece7da;
      --surface: #fffdf8;
      --ink: #292d27;
      --muted: #74796e;
      --line: #dfded3;
      --sage: #5d755e;
      --sage-dark: #405844;
      --sage-wash: #e4eadf;
      --clay: #bf6949;
      --clay-wash: #f3e4dc;
      --gold: #c39a49;
      --shadow: 0 16px 50px rgba(48, 49, 38, .07);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Aptos", "Segoe UI", "Helvetica Neue", sans-serif;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    [hidden] { display:none !important; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid rgba(93,117,94,.45); outline-offset: 3px; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0,1fr); max-width: 1600px; margin: 0 auto; }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 34px 20px 24px 30px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: rgba(245,242,233,.72); }
    .nav-label, .eyebrow { color: var(--muted); text-transform: uppercase; font-size: 10px; font-weight: 700; letter-spacing: .14em; }
    .nav-label { margin: 0 0 12px 12px; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { border: 0; background: transparent; border-radius: 9px; min-height: 44px; width: 100%; padding: 0 12px; display: flex; align-items: center; gap: 12px; text-align: left; color: #62685e; cursor: pointer; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .nav-item:hover { background: rgba(228,234,223,.7); color: var(--sage-dark); }
    .nav-item.active { background: var(--sage-wash); color: var(--sage-dark); font-weight: 650; }
    .nav-icon { width: 20px; text-align: center; font-size: 16px; line-height: 1; }
    .nav-count { margin-left: auto; font-size: 11px; color: var(--muted); }
    .sidebar-bottom { margin-top: auto; }
    .side-actions { display:flex; gap:8px; margin-top: 17px; }
    .text-button { border: 0; background: transparent; padding: 5px 0; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
    .text-button:hover { color: var(--sage-dark); text-decoration-color: currentColor; }
    main { min-width: 0; padding: 37px clamp(24px, 5vw, 74px) 80px; }
    .topline { display:flex; justify-content: space-between; align-items:center; gap: 20px; margin-bottom: 32px; }
    .date-label { color: var(--muted); font-size: 12px; letter-spacing: .025em; text-transform: capitalize; }
    .today-stamp { display: flex; align-items: center; gap: 10px; }
    .sun-mark { width: 28px; height: 28px; border: 1px solid #d9c99d; border-radius: 50%; color: #a88645; display:grid; place-items:center; font-size: 13px; }
    .greeting { color: var(--muted); font-size: 12px; }
    .greeting strong { color: var(--ink); font-weight: 650; }
    .page-heading { display:flex; align-items:flex-end; justify-content:space-between; gap: 24px; margin-bottom: 31px; }
    h1 { margin: 3px 0 0; font: 500 clamp(38px,5vw,56px)/1.02 var(--serif); letter-spacing: -.045em; }
    .heading-sub { color: var(--muted); margin: 12px 0 0; font-size: 13px; }
    .primary-button { display:inline-flex; align-items:center; justify-content:center; gap:9px; border:0; border-radius: 7px; padding: 12px 17px; background: var(--sage-dark); color: #fffdf8; font-weight: 650; cursor:pointer; box-shadow: 0 5px 13px rgba(64,88,68,.12); transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
    .primary-button:hover { transform: translateY(-2px); background: #314936; box-shadow: 0 8px 18px rgba(64,88,68,.18); }
    .primary-button:active { transform: translateY(0); }
    .primary-button .plus { font-size: 18px; font-weight: 400; line-height: .8; }
    .dashboard-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,340px),1fr)); gap: 20px; align-items:start; min-height:90px; }
    .dashboard-grid:empty { display:block; }
    .dashboard-empty { padding:30px 24px; border:1px dashed #bdc5b7; border-radius:var(--radius); background:rgba(255,253,248,.42); color:var(--muted); text-align:center; }
    .dashboard-empty strong { display:block; color:var(--sage-dark); font:22px var(--serif); font-weight:400; margin-bottom:6px; }
    .dashboard-widget { min-width:0; position:relative; }
    .dashboard-widget > .widget-tools { position:absolute; z-index:4; right:8px; top:8px; }
    .dashboard-widget > .widget-tools + .panel { padding-top:45px; }
    .dashboard-widget > .widget-tools + .focus-panel { padding-top:45px; }
    .dashboard-widget.dragging { opacity:.45; }
    .widget-tools { display:flex; align-items:center; gap:4px; }
    .widget-grip { cursor:grab; touch-action:none; font-size:17px; color:var(--muted); border:0; background:transparent; padding:4px 7px; border-radius:5px; }
    .widget-grip:active { cursor:grabbing; }
    .dashboard-widget .widget-remove { opacity:1; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; width:auto; min-width:30px; height:29px; padding:0 8px; border:1px solid #ead2c8; background:#fffaf7; color:var(--clay); font-size:11px; font-weight:650; white-space:nowrap; }
    .dashboard-widget .widget-remove:hover { opacity:1; background:var(--clay-wash); color:#8f432b; }
    .widget-add-dialog { width:min(440px,calc(100vw - 32px)); }
    .widget-options { display:grid; gap:8px; margin-top:18px; }
    .widget-option { width:100%; display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:9px; background:#fffdf8; padding:12px; text-align:left; cursor:pointer; }
    .widget-option:hover { border-color:#a9b9a5; background:var(--sage-wash); }
    .widget-option:disabled { opacity:.55; cursor:not-allowed; background:#f1efe8; }
    .widget-option span { color:var(--muted); font-size:11px; display:block; }
    .widget-option strong { color:var(--ink); font-size:13px; }
    .drop-indicator { outline:2px dashed var(--sage); outline-offset:3px; }
    .main-column, .right-column { display:grid; gap: 20px; min-width:0; }
    .focus-panel { overflow:hidden; position:relative; background: var(--sage-dark); color: #f9f7ef; border-radius: var(--radius); padding: 24px 27px 25px; min-height: 184px; display:flex; flex-direction:column; justify-content:space-between; }
    .focus-panel::after { content:""; position:absolute; width:230px; height:230px; border:1px solid rgba(255,255,255,.11); border-radius:50%; right:-45px; top:-100px; box-shadow: 0 0 0 18px rgba(255,255,255,.025), 0 0 0 38px rgba(255,255,255,.02); pointer-events:none; }
    .focus-top { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
    .focus-top .eyebrow { color:#cad6c6; }
    .focus-tag { font-size:10px; border:1px solid rgba(255,255,255,.24); border-radius:3px; padding:4px 8px; color:#e2e9dd; }
    .focus-panel h2 { position:relative; z-index:1; margin: 15px 0 7px; max-width: 500px; font: 26px/1.15 var(--serif); letter-spacing:-.025em; }
    .focus-panel p { position:relative; z-index:1; margin:0; color:#d6dfd1; font-size:12px; }
    .focus-bottom { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; margin-top:20px; color:#dce5
